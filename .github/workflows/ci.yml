name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "0.12.6"

      - name: Sync locked environment
        run: uv sync --locked

      - name: Lint
        run: uv run --locked ruff check

      - name: Check formatting
        run: uv run --locked ruff format --diff

      - name: Type check
        run: uv run --locked ty check

      - name: Test
        run: uv run --locked pytest

      - name: Build documentation
        run: uv run --locked sphinx-build -n -T -W --keep-going docs docs/_build/html

      - name: Build package
        run: uv build

      - name: Smoke test the built wheel
        shell: bash
        run: |
          wheel="$(find dist -name '*.whl' -print -quit)"
          uv run --isolated --no-project --python 3.14 --with "$wheel" \
            python - <<'PY'
          from importlib.resources import files

          from macpymessenger import (
              AppleScriptTransport,
              BulkSendResult,
              IMessageClient,
              SendRequest,
              TemplateManager,
              __version__,
          )

          package = files("macpymessenger")
          assert __version__ != "0+unknown"
          assert package.joinpath("py.typed").is_file()
          assert package.joinpath("osascript", "sendMessage.applescript").is_file()
          assert isinstance(IMessageClient().transport, AppleScriptTransport)
          assert SendRequest("+15555550123", "Hello").delay_seconds == 0
          assert BulkSendResult((), ()).sent == ()
          assert TemplateManager().list_templates() == {}
          PY
          uv run --isolated --no-project --python 3.14 --with "$wheel" \
            macpymessenger --version

      - name: Smoke test doctor JSON
        shell: bash
        run: |
          wheel="$(find dist -name '*.whl' -print -quit)"
          status=0
          output="$(uv run --isolated --no-project --python 3.14 --with "$wheel" macpymessenger doctor --json)" || status=$?
          test "$status" -eq 0 -o "$status" -eq 1
          DOCTOR_OUTPUT="$output" python - <<'PY'
          import json
          import os

          payload = json.loads(os.environ["DOCTOR_OUTPUT"])
          assert payload["tool"] == "macpymessenger-doctor"
          assert isinstance(payload["blocked"], bool)
          assert "ready" not in payload
          assert payload["checks"]
          for check in payload["checks"]:
              assert set(check) == {"identifier", "status", "summary", "next_step"}
              assert check["status"] in {"ok", "fail", "manual"}
          PY
