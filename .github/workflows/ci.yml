name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --locked

      - name: Lint
        run: uv run --locked ruff check

      - name: Check formatting
        run: uv run --locked ruff format --check

      - name: Type check
        run: uv run --locked ty check

      - name: Test
        run: uv run --locked pytest

      - name: Build documentation
        run: uv run --locked sphinx-build -W docs docs/_build/html

      - name: Build package
        run: uv build
