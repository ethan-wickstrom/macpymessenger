name: Upload Python Package

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.6"

      - name: Verify release tag matches package version
        shell: bash
        run: |
          version="$(python - <<'PY'
          import tomllib
          from pathlib import Path

          with Path("pyproject.toml").open("rb") as file:
              print(tomllib.load(file)["project"]["version"])
          PY
          )"
          test "$GITHUB_REF_NAME" = "v$version"

      - name: Build wheel and source distribution
        run: uv build

      - name: Verify installed wheel
        shell: bash
        run: |
          wheel="$(find dist -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv run --isolated --no-project --python 3.14 --with "$wheel" \
            python -P scripts/verify_installed_package.py

      - name: Verify installed source distribution
        shell: bash
        run: |
          sdist="$(find dist -name '*.tar.gz' -print -quit)"
          test -n "$sdist"
          uv run --isolated --no-project --python 3.14 --with "$sdist" \
            python -P scripts/verify_installed_package.py

      - name: Upload verified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish distributions to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/macpymessenger
    permissions:
      id-token: write

    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
