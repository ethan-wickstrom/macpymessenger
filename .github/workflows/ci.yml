name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          version: "0.12.6"

      - name: Sync locked environment
        run: uv sync --locked

      - name: Lint
        run: uv run --locked ruff check

      - name: Check formatting
        run: uv run --locked ruff format --diff

      - name: Type check
        run: uv run --locked ty check

      - name: Test
        run: uv run --locked pytest

      - name: Build documentation
        run: uv run --locked sphinx-build -n -T -W --keep-going docs docs/_build/html

      - name: Build package
        run: uv build

      - name: Verify installed wheel
        shell: bash
        run: |
          wheel="$(find dist -name '*.whl' -print -quit)"
          test -n "$wheel"
          uv run --isolated --no-project --python 3.14 --with "$wheel" \
            python -P scripts/verify_installed_package.py

      - name: Verify installed source distribution
        shell: bash
        run: |
          sdist="$(find dist -name '*.tar.gz' -print -quit)"
          test -n "$sdist"
          uv run --isolated --no-project --python 3.14 --with "$sdist" \
            python -P scripts/verify_installed_package.py
